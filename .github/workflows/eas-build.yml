name: EAS Build (Android)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Lint, typecheck and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run unit tests with coverage
        # --coverage hace que Jest aplique coverageThreshold (package.json):
        # si Statements/Branches/Functions/Lines no llegan al 90%, este paso
        # falla y el job "build" (que depende de "test") no se ejecuta.
        run: npm test -- --ci --coverage

  build:
    name: Build Android APK (EAS)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android APK on EAS
        run: eas build --platform android --profile preview --non-interactive --no-wait
